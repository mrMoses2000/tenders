interface:
  display_name: "Tender Procurement Notion"
  short_description: "Tender sourcing and Notion updates"
  default_prompt: "Use $tender-procurement-notion to research tender line items by item/specification first, never by tender price interval. Create/reuse supplier identities in Поставщики, create at least five useful candidate observations in Предложения when the market allows, link them to the request, write the cheapest technically valid supplier price found to Цена каталога, compare full cost with the tender price, and update Notion safely without sending messages or ordering."

policy:
  allow_implicit_invocation: true
