interface:
  display_name: "Tender Procurement Notion"
  short_description: "Tender sourcing and Notion updates"
  default_prompt: "Use $tender-procurement-notion to research tender line items by item/specification first, never by tender price interval. Create/reuse multiple supplier candidates in Notion, link them through the request row's Поставщики relation, write the cheapest technically valid supplier price found to Цена каталога, compare it with the tender price for margin, and update Notion safely without sending messages or ordering."

policy:
  allow_implicit_invocation: true
