name: procurement

services:
  waha:
    image: devlikeapro/waha:noweb-2026.9.1@sha256:2e4cbc92b16f82da330f8324064e0877e142b81224585938b2314c1d6c90774d
    container_name: procurement-waha
    restart: unless-stopped
    pids_limit: 512
    ports:
      - "127.0.0.1:13000:3000"
    env_file:
      - ../../var/secrets/waha.env
    volumes:
      - waha-sessions:/app/.sessions
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health',{headers:{'X-Api-Key':process.env.WAHA_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - waha

volumes:
  waha-sessions:
    name: procurement-waha-sessions

networks:
  waha:
    name: procurement-waha-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.247.0/24
          gateway: 172.29.247.1
